model:
  base_learning_rate: 2.0e-06
  target: shiftdm.shiftdm.ShiftLDM
  params:
    # ckpt_path:
    parent_model: ldm
    shift_stage_key: ['hint']
    shift_stage_scale: 1.0
    base_locked: True 
    shift_stage_config:
      target: shiftdm.shiftnet.shiftnet.ShiftNetBase
      params:
        # ckpt_path: 
        target_key: jpg
        encoder_config:
          target: shiftdm.shiftnet.encoders.fill50k_encoder
          params:
            # ckpt_path: 
            encode_key: hint
            layers: 4
            hidden_dim: 64
        # first_stage_config:


    # SD parameters, do not change to load the pretrained model
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: jpg
    cond_stage_key: txt
    image_size: 64
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: True
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder
      
data:
  target: training.data.dataloader.DataModuleFromConfig
  params:
    batch_size: 32
    num_workers: 4
    wrap: False
    train:
      target: training.data.dataset_fill50k.fill50k
      # params:

lightning:
  callbacks:
    image_logger:
      target: training.callbacks.ImageLogger
      params:
        batch_frequency: 200
        max_images: 4
        increase_log_steps: False
        log_images_kwargs:
          quantize_denoised: False
          inpaint : False
          plot_denoise_rows : False
          plot_progressive_rows : True
          plot_diffusion_rows : True

  trainer:
    accelerator: auto
    devices: auto
    strategy: auto
    precision: 32 # 64, 32, 16-mixed, bf16-mixed
    benchmark: True
    max_epochs: 100